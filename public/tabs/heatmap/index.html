<div class="heatmap-tab" data-tab-root>
  <div class="hm-controls">
    <select id="date-picker" class="hm-date-select" aria-label="Date"></select>

    <div class="hm-mode-strip" id="mode-group" role="tablist">
      <button class="hm-mode active" data-mode="depth"    type="button" role="tab">Depth</button>
      <button class="hm-mode"        data-mode="temp"     type="button" role="tab">Temp</button>
      <button class="hm-mode"        data-mode="concrete" type="button" role="tab">Concrete</button>
      <button class="hm-mode"        data-mode="delta"    type="button" role="tab">Delta</button>
      <button class="hm-mode"        data-mode="plan"     type="button" role="tab">Plan</button>
      <button class="hm-mode"        data-mode="anomaly"  type="button" role="tab">Anomaly</button>
    </div>

    <button class="hm-mesh-toggle active" id="mesh-toggle" type="button" aria-pressed="true" title="Toggle confidence mesh">
      <span class="hm-mesh-icon" aria-hidden="true"></span>
      <span>Mesh</span>
    </button>

    <span class="hm-queued-badge" id="queued-badge" hidden title="Entries waiting to sync"></span>

    <div class="hm-entry-split">
      <button class="hm-entry-btn primary" id="new-session-btn" type="button" title="Start a new measurement session for a fresh date">
        <span class="hm-entry-plus">+</span><span>New Session</span>
      </button>
      <button class="hm-entry-btn ghost" id="edit-session-btn" type="button" title="Edit readings on an existing date">
        <span>Edit</span>
      </button>
    </div>
  </div>

  <div class="hm-context" id="context-row" hidden>
    <label class="ctl delta-ctl" hidden>
      <span>vs.</span>
      <select id="delta-picker"></select>
    </label>
    <label class="ctl plan-ctl" hidden>
      <span>Cut depth</span>
      <input type="range" id="plan-cut" min="0" max="1.0" step="0.05" value="0.25">
      <span class="plan-value" id="plan-cut-value">0.25"</span>
    </label>
  </div>

  <div class="hm-empty" id="hm-empty" hidden>
    <div class="tab-stub">
      <h1>Lower rink</h1>
      <p>The lower rink is sand-floored — no thickness measurements taken. The heatmap only applies to the upper rink.</p>
      <span class="stub-tag">switch to Upper to view</span>
    </div>
  </div>

  <div class="hm-main" id="hm-main">
    <section class="hm-canvas-pane">
      <div class="hm-canvas-wrap">
        <canvas id="rink"></canvas>
        <div class="hm-legend" id="legend"></div>
      </div>
      <div class="hm-status" id="status"></div>
    </section>

    <div class="hm-sheet-backdrop" id="sheet-backdrop" aria-hidden="true"></div>

    <aside class="hm-side-pane" id="side">
      <div class="hm-sheet-peek" id="sheet-peek">
        <span id="sheet-peek-label">tap a point on the rink ▴</span>
      </div>
      <div class="hm-sheet-content" id="sheet-content">
        <div class="hm-empty-tap">tap any point on the rink for its history</div>
      </div>
    </aside>
  </div>

  <!-- Compact start dialog: pick a date + intent before entering point-by-point mode -->
  <dialog id="start-session-dialog" class="hm-start-dialog">
    <form method="dialog" id="start-session-form">
      <header class="hm-start-header">
        <h3 id="start-session-title">New Session</h3>
        <button type="button" class="btn-ghost" id="start-session-cancel" aria-label="Cancel">✕</button>
      </header>
      <label class="ctl">
        <span>Date</span>
        <input type="date" id="start-session-date" required>
      </label>
      <label class="ctl">
        <span>Order</span>
        <select id="start-session-order">
          <option value="serpentine" selected>Serpentine (recommended)</option>
          <option value="numeric">Numeric (1 → 35)</option>
        </select>
      </label>
      <div class="hm-start-status" id="start-session-status"></div>
      <div class="hm-start-actions">
        <button type="button" class="btn-ghost" id="start-session-cancel-2">Cancel</button>
        <button type="submit" class="btn-primary" id="start-session-go">Begin</button>
      </div>
    </form>
  </dialog>

  <!-- Draft restore prompt -->
  <dialog id="draft-restore-dialog" class="hm-start-dialog">
    <form method="dialog" id="draft-restore-form">
      <header class="hm-start-header">
        <h3>Resume draft?</h3>
      </header>
      <p id="draft-restore-summary" class="hm-draft-summary"></p>
      <div class="hm-start-actions">
        <button type="button" class="btn-ghost" id="draft-discard">Discard</button>
        <button type="submit" class="btn-primary" id="draft-resume">Resume</button>
      </div>
    </form>
  </dialog>

  <!-- Entry mode: full-screen takeover w/ rink + per-point sheet -->
  <div class="hm-entry-mode" id="entry-mode" hidden>
    <header class="hm-entry-bar">
      <button type="button" class="btn-ghost" id="entry-exit" aria-label="Exit entry mode">✕</button>
      <div class="hm-entry-meta">
        <strong id="entry-mode-date"></strong>
        <span class="hm-entry-mode-tag" id="entry-mode-tag"></span>
      </div>
      <div class="hm-entry-progress" id="entry-progress">0/35</div>
      <button type="button" class="btn-ghost" id="entry-order-toggle" title="Toggle walking order">↻ Order</button>
      <button type="button" class="btn-primary" id="entry-finish">Save Session</button>
    </header>

    <div class="hm-entry-stage">
      <div class="hm-entry-canvas-wrap">
        <canvas id="entry-rink"></canvas>
      </div>

      <aside class="hm-entry-sheet" id="entry-sheet">
        <div class="hm-entry-sheet-head">
          <button type="button" class="hm-entry-nav" id="entry-prev" aria-label="Previous point">◀</button>
          <div class="hm-entry-pt">
            <span class="hm-entry-pt-num" id="entry-pt-num">—</span>
            <span class="hm-entry-pt-label" id="entry-pt-label">tap a point</span>
          </div>
          <button type="button" class="hm-entry-nav" id="entry-next" aria-label="Next point">▶</button>
        </div>

        <div class="hm-entry-fields" id="entry-fields" hidden>
          <label class="hm-entry-field">
            <span>Depth (in)</span>
            <input type="text" inputmode="decimal" autocomplete="off" id="entry-depth" placeholder="—" pattern="[0-9]*\.?[0-9]*">
            <small class="hm-entry-hint" id="entry-depth-hint"></small>
          </label>
          <label class="hm-entry-field">
            <span>Temp (°F)</span>
            <input type="text" inputmode="decimal" autocomplete="off" id="entry-temp" placeholder="—" pattern="-?[0-9]*\.?[0-9]*">
            <small class="hm-entry-hint" id="entry-temp-hint"></small>
          </label>
          <div class="hm-entry-flag" id="entry-flag" hidden></div>
          <div class="hm-entry-actions">
            <button type="button" class="btn-ghost" id="entry-skip">Skip / mark unmeasurable</button>
            <button type="button" class="btn-ghost" id="entry-clear">Clear</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- End-of-session summary -->
  <dialog id="entry-summary-dialog" class="hm-summary-dialog">
    <form method="dialog" id="entry-summary-form">
      <header class="hm-start-header">
        <h3>Review session</h3>
      </header>
      <div id="entry-summary-body"></div>
      <div class="hm-start-actions">
        <button type="button" class="btn-ghost" id="entry-summary-back">Back to entry</button>
        <button type="submit" class="btn-primary" id="entry-summary-confirm">Save Session</button>
      </div>
    </form>
  </dialog>
</div>
