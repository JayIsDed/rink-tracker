<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<meta name="color-scheme" content="dark">
<title>Rink Tracker</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rink Tracker">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="view-title">Rink Tracker</h1>
    <span class="spacer"></span>
    <button class="btn small" id="who-btn" type="button" aria-label="Who you are">…</button>
  </header>

  <!-- The dock is generated from the view registry, never hand-written. A tab
       exists here on the commit that ships its surface and not before. -->
  <main class="view" id="view" tabindex="-1"></main>
  <nav class="dock" id="dock" aria-label="Sections"></nav>
</div>

<script type="module" src="/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((err) => {
      console.warn("[pwa] sw registration failed:", err);
    });
  });
}
</script>
</body>
</html>
